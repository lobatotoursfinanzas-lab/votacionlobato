<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lobato Tours — Talle de camiseta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --guinda: #A1151F;
    --guinda-dark: #7E0F17;
    --guinda-soft: #F6E6E7;
    --gray-900: #333333;
    --gray-700: #585858;
    --gray-500: #919191;
    --gray-100: #F7F5F4;
    --white: #FFFFFF;
    --radius: 18px;
    --focus: 3px solid #2B6CB0;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--gray-100);color:var(--gray-900);}
  h1,h2,h3,.brand-word{font-family:'Nunito',sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible, input:focus-visible{outline:var(--focus); outline-offset:2px;}
  .screen{display:none; min-height:100vh; flex-direction:column;}
  .screen.active{display:flex;}
  img{max-width:100%; display:block;}

  /* ---------- WELCOME ---------- */
  #welcome{align-items:center; justify-content:center; padding:32px 20px; text-align:center; background:var(--white);}
  .welcome-card{max-width:460px; width:100%;}
  .logo-big{width:min(70vw, 300px); margin:0 auto 28px;}
  .welcome-title{font-size:clamp(28px,6vw,36px); font-weight:900; color:var(--guinda); margin:0 0 10px;}
  .welcome-sub{font-size:20px; color:var(--gray-700); margin:0 0 28px; line-height:1.5;}
  .name-label{display:block; font-size:19px; font-weight:700; color:var(--gray-900); margin-bottom:10px; text-align:left;}
  .name-input{width:100%; font-size:22px; padding:16px 18px; border:2px solid var(--gray-500); border-radius:12px; margin-bottom:26px;}
  .name-input:focus{border-color:var(--guinda);}
  .btn-primary{width:100%; background:var(--guinda); color:var(--white); border:none; font-size:22px; font-weight:800; padding:20px 24px; border-radius:14px; transition:background .15s, transform .1s;}
  .btn-primary:hover{background:var(--guinda-dark);}
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{background:var(--gray-500); cursor:not-allowed;}

  /* ---------- TOPBAR ---------- */
  .topbar{background:var(--guinda); display:flex; align-items:center; justify-content:space-between; padding:14px 22px; gap:16px;}
  .topbar-brand{display:flex; align-items:center; gap:12px;}
  .topbar-logo{height:34px; width:auto; display:block;}
  .topbar-hello{color:var(--white); font-size:16px; font-weight:600; opacity:.95; text-align:right;}

  /* ---------- VOTING ---------- */
  #voting{background:var(--gray-100);}
  .voting-main{flex:1; max-width:780px; margin:0 auto; width:100%; padding:32px 20px 60px; text-align:center;}
  .voting-title{font-size:clamp(24px,5vw,30px); font-weight:900; color:var(--gray-900); line-height:1.35; margin:0 0 30px;}
  .voting-title .accent{color:var(--guinda);}
  .cards{display:grid; grid-template-columns:1fr; gap:16px;}
  @media(min-width:560px){ .cards{grid-template-columns:1fr 1fr;} }
  .dest-card{background:var(--white); border:2.5px solid #E6E1DF; border-radius:var(--radius); padding:24px 22px; display:flex; align-items:center; gap:16px; text-align:left; transition:border-color .15s, transform .1s, box-shadow .15s;}
  .dest-card:hover{border-color:var(--guinda); box-shadow:0 4px 14px rgba(161,21,31,0.12);}
  .dest-card:active{transform:scale(0.98);}
  .dest-card.selected{border-color:var(--guinda); background:var(--guinda-soft); box-shadow:0 4px 14px rgba(161,21,31,0.18);}
  .dest-name{font-size:22px; font-weight:800; color:var(--gray-900);}
  .dest-tag{font-size:15px; color:var(--gray-700); margin-top:4px;}
  .check{margin-left:auto; width:26px; height:26px; border-radius:50%; border:2.5px solid var(--gray-500); flex-shrink:0;}
  .dest-card.selected .check{background:var(--guinda); border-color:var(--guinda); position:relative;}
  .dest-card.selected .check::after{content:''; position:absolute; left:7px; top:3px; width:6px; height:11px; border:solid white; border-width:0 3px 3px 0; transform:rotate(45deg);}

  .confirm-bar{max-width:780px; margin:0 auto; width:100%; padding:0 20px 40px;}
  .btn-confirm{width:100%; background:var(--guinda); color:var(--white); border:none; font-size:22px; font-weight:800; padding:20px 24px; border-radius:14px; opacity:0.4; pointer-events:none; transition:opacity .2s;}
  .btn-confirm.enabled{opacity:1; pointer-events:auto;}
  .btn-confirm:hover{background:var(--guinda-dark);}

  /* ---------- THANK YOU ---------- */
  #thanks{align-items:center; justify-content:center; text-align:center; background:var(--white); padding:32px 20px;}
  .thanks-icon{width:88px; height:88px; border-radius:50%; background:var(--guinda-soft); display:flex; align-items:center; justify-content:center; margin:0 auto 26px;}
  .thanks-icon svg{width:46px; height:46px; stroke:var(--guinda);}
  .thanks-title{font-size:clamp(26px,6vw,32px); font-weight:900; color:var(--guinda); margin:0 0 14px;}
  .thanks-sub{font-size:20px; color:var(--gray-700); max-width:420px; margin:0 auto 6px; line-height:1.5;}
  .thanks-dest{font-size:20px; color:var(--gray-900); font-weight:800; margin-bottom:30px;}

  .stage-note{position:fixed; bottom:10px; right:14px; background:rgba(0,0,0,.55); color:#fff; font-size:12px; padding:5px 10px; border-radius:8px; font-family:'Inter',sans-serif;}
</style>
</head>

<script>
const talles = [
  {name:"Chico"},
  {name:"Mediano"},
  {name:"Grande"},
  {name:"Extra Grande"}
];

const cardsWrap = document.getElementById('cardsWrap');
let selected = null;

talles.forEach(t=>{
  const card = document.createElement('button');
  card.className = 'dest-card';
  card.setAttribute('type','button');
  card.innerHTML = `
    <span>
      <div class="dest-name">${t.name}</div>
    </span>
    <span class="check"></span>
  `;
  card.addEventListener('click', ()=>{
    document.querySelectorAll('.dest-card').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    selected = t.name;
    document.getElementById('confirmBtn').classList.add('enabled');
  });
  cardsWrap.appendChild(card);
});

const nameInput = document.getElementById('nameInput');
const startBtn = document.getElementById('startBtn');
nameInput.addEventListener('input', ()=>{
  startBtn.disabled = nameInput.value.trim().length === 0;
});

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

startBtn.addEventListener('click', ()=>{
  const name = nameInput.value.trim();
  document.getElementById('topbarHello').textContent = 'Hola, ' + name;
  showScreen('voting');
});

// Pega aquí la URL de tu Google Apps Script (termina en /exec)
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx9SdNUzkSixDtZzILSZIv2WYlE3vkC-Vw-MeXnisMm7dVQFmiQUt-sHcvTNUZEFoRL/exec';

document.getElementById('confirmBtn').addEventListener('click', async ()=>{
  if(!selected) return;
  const name = nameInput.value.trim() || 'cliente';
  const confirmBtn = document.getElementById('confirmBtn');

  confirmBtn.disabled = true;
  confirmBtn.textContent = 'Enviando...';

  try{
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // Apps Script no soporta CORS normal, así que no leemos la respuesta
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({ nombre: name, talle: selected })
    });
  }catch(err){
    console.error('No se pudo registrar el talle:', err);
    // Aun si falla la red, dejamos seguir para no trabar al usuario;
    // si prefieres bloquear el flujo en caso de error, avísame y lo ajustamos.
  }

  document.getElementById('thanksName').textContent = name;
  document.getElementById('thanksDest').textContent = selected;
  confirmBtn.disabled = false;
  confirmBtn.textContent = 'Confirmar mi talle';
  showScreen('thanks');
});
</script>
</body>
</html>
